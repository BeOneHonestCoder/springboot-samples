version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql-test
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: test
      MYSQL_USER: user
      MYSQL_PASSWORD: 123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 【核心修改】 这里只写卷名，不写路径
      - mysql-data-vol:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

# 在文件底部声明这个卷
volumes:
  mysql-data-vol: