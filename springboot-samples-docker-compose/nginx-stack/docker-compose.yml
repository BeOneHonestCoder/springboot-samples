services:
  # 负载均衡器 (Nginx)
  load-balancer:
    image: nginx:latest
    container_name: nginx-lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - service_a
      - service_b

  # 后端服务 A
  service_a:
    image: nginxdemos/hello:plain-text
    container_name: server-a

  # 后端服务 B
  service_b:
    image: nginxdemos/hello:plain-text
    container_name: server-b