version: '3'
services:
  # 1. Elasticsearch (Database)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: es-local
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - elk-net

  # 2. Kibana (UI Dashboard)
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: kibana-local
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - elk-net

  # 3. Logstash (Processor/Filter)
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.10
    container_name: logstash-local
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch
    networks:
      - elk-net

  # 4. Filebeat (Shipper)
  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.10
    container_name: filebeat-local
    user: root
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # MOUNTING YOUR LOCAL WINDOWS PATH HERE
      # Mapping D:\IdeaProjects\springboot-demo\logs to /var/log/app-logs inside container
      - D:\IdeaProjects\springboot-demo\logs:/var/log/app-logs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    command: filebeat -e -strict.perms=false
    networks:
      - elk-net

networks:
  elk-net:
    driver: bridge